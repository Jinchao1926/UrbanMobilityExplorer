name: iOS Tests

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ios-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PROJECT: UrbanMobilityExplorer.xcodeproj
  SCHEME: UrbanMobilityExplorer
  DESTINATION: platform=iOS Simulator,OS=latest,name=iPhone 16 Pro

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Print environment
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcodebuild -list -project "$PROJECT"
          xcrun simctl list devices available

      - name: Run tests
        run: |
          set -o pipefail
          mkdir -p test-results
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -resultBundlePath test-results/iOS-Tests.xcresult \
            -enableCodeCoverage YES | tee test-results/xcodebuild.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: test-results
          if-no-files-found: ignore
