name: iOS Tests

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ios-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: '16'
  PROJECT: UrbanMobilityExplorer.xcodeproj
  SCHEME: UrbanMobilityExplorer
  DESTINATION: platform=iOS Simulator,OS=latest,name=iPhone 16 Pro

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    steps:
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install xcpretty
        run: gem install xcpretty -v 0.3.0

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -enableCodeCoverage YES | \
            "$(gem env gemdir)/gems/xcpretty-0.3.0/bin/xcpretty" \
              --color \
              --report junit \
              --output test-results/unit-tests/results.xml
