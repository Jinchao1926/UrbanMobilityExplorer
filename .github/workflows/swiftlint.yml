name: SwiftLint

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: swiftlint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run SwiftLint
        uses: norio-nomura/action-swiftlint@3.2.1
        with:
          args: --strict
